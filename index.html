<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./script.js"></script>
    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <main>
      <h1>
        SPLI <br />
        TTER
      </h1>
      <section class="app-container">
        <form
          id="calc-form"
          action="/"
          method="get"
          class="input-box"
          novalidate
        >
          <div class="select-currency-wrapper">
            <label for="currency-select" class="currency-label">Currency</label>
            <select name="currency" id="currency-select">
              <option id="NOK" value="NOK">NOK</option>
              <option id="EUR" value="EUR">EUR</option>
              <option id="USD" value="USD">USD</option>
              <option id="GBP" value="GBP">GBP</option>
            </select>
          </div>
          <div class="bill-wrapper">
            <div class="label-wrapper">
              <label for="bill-input" class="bill-label">Bill</label>
              <p id="bill-error" class="bill-error" aria-live="polite"></p>
            </div>
            <input
              id="bill-input"
              class="bill-input"
              type="number"
              min="0"
              step="0.01"
              placeholder="enter amount"
              aria-describedby="bill-error"
              required
            />
          </div>
          <div class="tip-wrapper">
            <p class="tip-label">Select Tip %</p>
            <div
              class="tip-btns"
              role="group"
              aria-label="tip-percentage-inputs"
            >
              <button
                type="button"
                class="percentBtn"
                id="perc5"
                value="5"
                aria-pressed="false"
              >
                5%
              </button>
              <button
                type="button"
                class="percentBtn"
                id="perc10"
                value="10"
                aria-pressed="false"
              >
                10%
              </button>
              <button
                type="button"
                class="percentBtn"
                id="perc15"
                value="15"
                aria-pressed="false"
              >
                15%
              </button>
              <button
                type="button"
                class="percentBtn"
                id="perc25"
                value="25"
                aria-pressed="false"
              >
                25%
              </button>
              <button
                type="button"
                class="percentBtn"
                id="perc50"
                value="50"
                aria-pressed="false"
              >
                50%
              </button>
              <label for="custom-input" class="visually-hidden"
                >Enter custom percentage</label
              >
              <input
                id="custom-input"
                class="custom-input"
                type="number"
                placeholder="custom"
                min="0"
                max="100"
                step="1"
                aria-describedby="custom-error"
              />
              <p id="custom-error" class="custom-error" aria-live="polite"></p>
            </div>
          </div>
          <div class="people-wrapper">
            <div class="label-wrapper">
              <label for="people-input" class="people-label"
                >Number of People</label
              >
              <p id="people-error" class="people-error" aria-live="polite"></p>
            </div>
            <input
              id="people-input"
              class="people-input"
              type="number"
              min="1"
              max="999"
              step="1"
              placeholder="how many?"
              aria-describedby="people-error"
              required
            />
          </div>
        </form>

        <div class="output-box">
          <div class="result-wrapper">
            <div class="tip-amount-wrapper">
              <div class="text-person">
                <p class="amount">Tip Amount</p>
                <p class="person">/ person</p>
              </div>
              <div class="amount-result">
                <p
                  id="tip-amount-result"
                  class="amount-number"
                  aria-live="polite"
                >
                  0.00
                </p>
                <img
                  class="currency-icon krone-icon hidden"
                  src="./images/icon-krone-green.svg"
                  alt=""
                  width="23px"
                  aria-hidden="true"
                />
                <img
                  class="currency-icon euro-icon hidden"
                  src="./images/icon-euro-green.svg"
                  alt=""
                  width="23px"
                  aria-hidden="true"
                />
                <img
                  class="currency-icon dollar-icon hidden"
                  src="./images/icon-dollar-green.svg"
                  alt=""
                  width="19px"
                  aria-hidden="true"
                />
                <img
                  class="currency-icon pound-icon hidden"
                  src="./images/icon-pound-green.svg"
                  alt=""
                  width="22px"
                  aria-hidden="true"
                />
              </div>
            </div>
            <div class="total-amount-wrapper">
              <div class="text-person">
                <p class="amount">Total</p>
                <p class="person">/ person</p>
              </div>
              <div class="amount-result">
                <p
                  id="total-amount-result"
                  class="amount-number"
                  aria-live="polite"
                >
                  0.00
                </p>
                <img
                  class="currency-icon krone-icon hidden"
                  src="./images/icon-krone-green.svg"
                  alt=""
                  width="23px"
                  aria-hidden="true"
                />
                <img
                  class="currency-icon euro-icon hidden"
                  src="./images/icon-euro-green.svg"
                  alt=""
                  width="23px"
                  aria-hidden="true"
                />
                <img
                  class="currency-icon dollar-icon hidden"
                  src="./images/icon-dollar-green.svg"
                  alt=""
                  width="19px"
                  aria-hidden="true"
                />
                <img
                  class="currency-icon pound-icon hidden"
                  src="./images/icon-pound-green.svg"
                  alt=""
                  width="22px"
                  aria-hidden="true"
                />
              </div>
            </div>
          </div>
          <button type="button" id="reset-btn" class="reset-btn">RESET</button>
        </div>
      </section>
    </main>

    <footer>
      <div class="attribution">
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          rel="noopener noreferrer"
          target="_blank"
          >Frontend Mentor</a
        >. Coded by
        <a
          href="https://github.com/norwegJan"
          rel="noopener noreferrer"
          target="_blank"
          >norwegJan</a
        >.
      </div>
    </footer>
  </body>
</html>
